name = "biggerthangame"
main = "worker/index.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "biggerthangame.com", custom_domain = true }
]

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Workers Logs: one structured line per refusal or failure, and per run start
# and end (worker/src/log.ts, ARCHITECTURE.md §19). Kept for a few days.
[observability]
enabled = true
head_sampling_rate = 1

# Gameplay events (start, answer, end) for Workers Analytics Engine
# (worker/src/analytics.ts, ARCHITECTURE.md §19). The dataset is created on the
# first write; query it with `pnpm stats`. The name is mirrored as DATASET in
# analytics.ts, and a test fails if the two drift.
[[analytics_engine_datasets]]
binding = "GAME_EVENTS"
dataset = "biggerthan_game_events"

# Feedback forms (POST /api/feedback) are emailed through Email Routing. The
# destination is the FEEDBACK_TO secret, deliberately not a destination_address
# here: this file is public. TURNSTILE_SECRET is a secret too.
[[send_email]]
name = "FEEDBACK_EMAIL"

# Rate limits for POST /api/round/next — the only thing between the deck and a
# scraper (DESIGN.md §3), without blocking many players behind one shared IP.
# Answers are limited per signed run id; run starts and every request per IP
# (IPv4, or the IPv6 /64). ARCHITECTURE.md §12. Periods can only be 10 or 60.
# Mirrored as RATE_LIMITS in worker/src/rate-limit.ts; a test fails if the two
# drift. namespace_id must be unique per binding within the Cloudflare account.
[[ratelimits]]
name = "RUN_ANSWERS"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 20
  period = 10

[[ratelimits]]
name = "RUN_STARTS"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "ROUND_FLOOD"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 800
  period = 60

# Feedback messages per IP (POST /api/feedback).
[[ratelimits]]
name = "FEEDBACK_SENDS"
namespace_id = "1006"

  [ratelimits.simple]
  limit = 10
  period = 60
