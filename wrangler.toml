name = "biggerthangame"
main = "worker/index.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "biggerthangame.com", custom_domain = true }
]

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]