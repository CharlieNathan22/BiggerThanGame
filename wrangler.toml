name = "biggerthangame"
main = "worker/index.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "biggerthangame.com", custom_domain = true }
]

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Workers Logs: one structured line per refusal or failure, per run start and
# end, and per accepted feedback message (worker/src/log.ts, ARCHITECTURE.md
# §19). Kept 3 days.
[observability]
enabled = true
head_sampling_rate = 1

# Off on purpose: Cloudflare's automatic invocation logs record every request's
# IP, location, user agent and headers, which the privacy rules forbid (§19).
# Our own log() lines are unaffected.
[observability.logs]
invocation_logs = false

# Gameplay events (start, answer, end) for Workers Analytics Engine
# (worker/src/analytics.ts, ARCHITECTURE.md §19). The dataset is created on the
# first write; query it with `pnpm stats`. The name is mirrored as DATASET in
# analytics.ts, and a test fails if the two drift.
[[analytics_engine_datasets]]
binding = "GAME_EVENTS"
dataset = "biggerthan_game_events"

# Feedback forms (POST /api/feedback) are emailed through Email Routing. The
# destination is the FEEDBACK_TO secret, deliberately not a destination_address
# here: this file is public. TURNSTILE_SECRET is a secret too.
[[send_email]]
name = "FEEDBACK_EMAIL"

# Rate limits for POST /api/round/next — the only thing between the deck and a
# scraper (DESIGN.md §3), without blocking many players behind one shared IP.
# Answers are limited per signed run id; run starts and every request per IP
# (IPv4, or the IPv6 /64). ARCHITECTURE.md §12. Periods can only be 10 or 60.
# Mirrored as RATE_LIMITS in worker/src/rate-limit.ts; a test fails if the two
# drift. namespace_id must be unique per binding within the Cloudflare account.
[[ratelimits]]
name = "RUN_ANSWERS"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 20
  period = 10

[[ratelimits]]
name = "RUN_STARTS"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "ROUND_FLOOD"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 800
  period = 60

# Feedback messages per IP (POST /api/feedback).
[[ratelimits]]
name = "FEEDBACK_SENDS"
namespace_id = "1006"

  [ratelimits.simple]
  limit = 10
  period = 60

# Publishes to the Endless boards per IP (POST /api/run/submit).
[[ratelimits]]
name = "RUN_SUBMITS"
namespace_id = "1007"

  [ratelimits.simple]
  limit = 60
  period = 60

# One Durable Object per Endless run (worker/run-do.ts, ARCHITECTURE.md §8):
# it spends each progress token once, keeps the run's answer times and closes a
# run that goes silent. SQLite-backed, which the free plan supports; the
# migration below creates the class on the next deploy.
[[durable_objects.bindings]]
name = "RUNS"
class_name = "RunDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunDO"]

# The leaderboards (ARCHITECTURE.md §10): scores and the nightly snapshots.
# Local dev and every test use wrangler's local D1 (under .wrangler/); nothing
# here or in the scripts points at the remote database. The owner creates it
# on deploy day (`wrangler d1 create biggerthangame`), puts its id below and
# applies the migrations with `pnpm db:migrate:remote`.
[[d1_databases]]
binding = "DB"
database_name = "biggerthangame"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The nightly job (worker/src/cron.ts): snapshot the boards that closed at
# midnight UTC and prune old scores; again at 01:30 for runs published late.
[triggers]
crons = ["0 0 * * *", "30 1 * * *"]
